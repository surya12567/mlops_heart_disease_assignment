name: MLOps CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Download UCI dataset
        run: python -m src.data --download
      - name: EDA
        run: python -m src.eda
      - name: Train and evaluate
        run: python -m src.train --no-tune
      - name: Upload reports and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-artifacts
          path: |
            reports/
            models/
            mlruns/
          if-no-files-found: warn
